<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VoiceForge</title>
  <style>
    :root {
      --bg: #f8f5f0;
      --text: #1a1a1a;
      --card: #ffffff;
      --border: #e0d9c8;
      --primary: #7ed0b3;
      --accent: #a8b4ff;
      --soft: #ffe4d1;
    }
    [data-theme="dark"] {
      --bg: #0a0a0a;
      --text: #f0e6d2;
      --card: #111111;
      --border: #444;
      --primary: #6bc9a8;
      --accent: #9aa8ff;
      --soft: #3a2f2a;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px;
      transition: background 0.4s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .theme-toggle {
      width: 48px;
      height: 48px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 240px;
      background: transparent;
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      color: var(--text);
      font-size: 17px;
      resize: vertical;
      margin-bottom: 20px;
    }

    .voice-select-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    select {
      width: 100%;
      padding: 18px 20px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      color: var(--text);
      font-size: 17px;
      appearance: none;
    }

    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #000;
      font-weight: 700;
      font-size: 18px;
      border: none;
      border-radius: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    button:active { transform: scale(0.97); }

    .history-item {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      position: relative;
      transition: all 0.2s;
    }
    .history-item:active {
      transform: translateY(-3px);
    }
    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 20px;
      line-height: 28px;
      cursor: pointer;
    }

    audio {
      width: 100%;
      margin: 16px 0 10px;
      border-radius: 12px;
    }

    .info {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin: 20px 0;
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <h1>VoiceForge</h1>
    <div class="theme-toggle" onclick="toggleTheme()">☀️</div>
  </header>

  <div class="card">
    <textarea id="textInput" placeholder="Paste or write your long narration here..."></textarea>

    <div class="voice-select-wrapper">
      <select id="voiceSelect"></select>
    </div>

    <button onclick="generateVoiceover()">
      🎙️ Generate Voiceover
    </button>
  </div>

  <div id="playerSection" class="card" style="display:none;">
    <audio id="audioPlayer" controls></audio>
    <button onclick="saveVoiceover()">
      💾 Save to Library
    </button>
  </div>

  <div class="info">
    <span id="storageInfo"></span>
    <button onclick="clearAll()" style="background:var(--card); color:var(--text); width:auto; padding:10px 18px; margin-left:12px; border:2px solid var(--border);">
      Clear All
    </button>
  </div>

  <h3 style="margin: 8px 0 16px; font-size: 22px; padding-left: 4px;">Your Library</h3>
  <div id="historyList"></div>

  <script>
    const MURF_API_KEY = "ap2_9c9ed9f6-c889-4fff-b8b7-fb776f1cc977";
    let currentAudioUrl = null;
    let currentText = '';

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      
      const toggle = document.querySelector('.theme-toggle');
      toggle.textContent = isDark ? '☀️' : '🌙';
    }

    async function loadVoices() {
      const select = document.getElementById('voiceSelect');
      try {
        const res = await fetch('https://api.murf.ai/v1/speech/voices', {
          headers: { 'api-key': MURF_API_KEY }
        });
        const data = await res.json();
        select.innerHTML = '';
        data.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.voiceId || v.voice_id;
          opt.textContent = `${v.displayName || v.name} — ${v.locale}`;
          select.appendChild(opt);
        });
      } catch(e) { console.error(e); }
    }

    async function generateVoiceover() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) return alert("Please enter some text");

      const voiceId = document.getElementById('voiceSelect').value;

      try {
        const res = await fetch('https://api.murf.ai/v1/speech/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'api-key': MURF_API_KEY
          },
          body: JSON.stringify({
            text: text,
            voiceId: voiceId,
            format: "MP3",
            pitch: -6,
            rate: 4,
            variation: 4,
            style: "Narration"
          })
        });

        const data = await res.json();
        const url = data.audioFile || data.audio_file;

        if (url) {
          currentAudioUrl = url;
          currentText = text;
          document.getElementById('audioPlayer').src = url;
          document.getElementById('playerSection').style.display = 'block';
        }
      } catch(e) {
        alert("Failed to generate voiceover");
      }
    }

    function saveVoiceover() {
      if (!currentAudioUrl) return;
      const title = prompt("Title for this voiceover:", "Voiceover " + new Date().toLocaleDateString());
      
      const records = JSON.parse(localStorage.getItem('voiceovers') || '[]');
      records.push({
        id: Date.now(),
        title: title || "Untitled",
        text: currentText,
        audioUrl: currentAudioUrl,
        date: new Date().toISOString()
      });
      localStorage.setItem('voiceovers', JSON.stringify(records));
      loadHistory();
      alert("✅ Saved!");
    }

    function loadHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const records = JSON.parse(localStorage.getItem('voiceovers') || '[]');

      const used = new Blob([JSON.stringify(records)]).size / 1024;
      document.getElementById('storageInfo').textContent = `Used: ${used.toFixed(1)} KB`;

      records.forEach(record => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <strong>${record.title}</strong><br>
          <small style="color:#888;">${new Date(record.date).toLocaleString()}</small>
          <button class="delete-btn" onclick="deleteItem(${record.id}); event.stopImmediatePropagation()">×</button>
        `;
        div.onclick = () => {
          document.getElementById('audioPlayer').src = record.audioUrl;
          document.getElementById('playerSection').style.display = 'block';
        };
        list.appendChild(div);
      });
    }

    function deleteItem(id) {
      if (!confirm("Delete this voiceover?")) return;
      let records = JSON.parse(localStorage.getItem('voiceovers') || '[]');
      records = records.filter(r => r.id !== id);
      localStorage.setItem('voiceovers', JSON.stringify(records));
      loadHistory();
    }

    function clearAll() {
      if (confirm("Clear entire library?")) {
        localStorage.removeItem('voiceovers');
        loadHistory();
      }
    }

    window.onload = () => {
      loadVoices();
      loadHistory();
    };
  </script>
</body>
</html>
